server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve timberconnect app at /timberconnect/
    location /timberconnect/ {
        alias /usr/share/nginx/html/;
        index index.html;

        # index.html darf nie gecacht werden, sonst halten Browser/Webviews
        # nach einem Deploy alte Bundle-Referenzen fest (Assets unten sind
        # gehasht und bleiben langzeit-cachebar).
        add_header Cache-Control "no-store";

        # For SPA routing: serve index.html for any non-file requests
        try_files $uri $uri/ /timberconnect/index.html;
    }

    # Cache static assets
    location ~* ^/timberconnect/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # .mjs (ES-Module, u.a. der PDF.js-Worker): nginx' mime.types kennt die
    # Endung nicht und liefert sonst application/octet-stream — zusammen mit
    # nosniff verweigert der Browser dann die Ausfuehrung als Modul-Worker.
    location ~* ^/timberconnect/(.+\.mjs)$ {
        alias /usr/share/nginx/html/$1;
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect root to /timberconnect/
    location = / {
        return 301 /timberconnect/;
    }

    # Catch-all: redirect to timberconnect
    location / {
        return 301 /timberconnect/;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
